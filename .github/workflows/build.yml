name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
# allow manual trigger

env:
  ProjName: upc_r1

jobs:
  build:
    runs-on: windows-latest
    permissions: read-all

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Add GitHub NuGet Source
      run: dotnet nuget add source https://nuget.pkg.github.com/ServerEmus/index.json --name "github" --username "any" --password ${{ secrets.GITHUB_TOKEN  }} --store-password-in-clear-text

    - name: Build X64
      run: dotnet publish ${{ env.ProjName }}/${{ env.ProjName }}.csproj -r win-x64 -c:Release -p:Platform=x64 -o Out

    - name: Build X86
      run: dotnet publish ${{ env.ProjName }}/${{ env.ProjName }}.csproj -r win-x86 -c:Release -p:Platform=x86 -o Out

    - name : Sign
      uses: ServerEmus/sign_action@main
      continue-on-error: true
      with:
        certificate: '${{ secrets.Sign_PFX }}'
        dir: '${{ github.workspace }}\Out'
        file: 'upc_r1.dll upc_r164.dll'
        password: ServerEmus

    - name : Upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ProjName }}
        path: Out/*